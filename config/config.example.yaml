# Example only: replace the node with your own, or pass your existing Clash/mihomo config to
# scripts/prepare-config.py instead. Never commit a config with real servers or passwords.
mixed-port: 7890
socks-port: 7891
allow-lan: true
mode: rule
log-level: warning
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  listen: 127.0.0.1:1053
  nameserver: [223.5.5.5, 119.29.29.29]
proxies:
  - name: example-node
    type: ss
    server: example.com
    port: 8388
    cipher: aes-128-gcm
    password: CHANGE-ME
proxy-groups:
  - name: Proxy
    type: select
    proxies: [example-node, DIRECT]
rules:
  - GEOIP,LAN,DIRECT
  - GEOIP,CN,DIRECT
  - MATCH,Proxy
